<!doctype html>
<html><head><meta charset="utf-8"><title>Bowl Battle Cover</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:#fff;background:#06202e;overflow:hidden}
#c{position:relative;overflow:hidden;background:#06202e}
.abs{position:absolute}
.half{position:absolute;inset:0}
.g{background:linear-gradient(160deg,rgba(10,60,38,.86),rgba(16,96,60,.74)),url(assets/goddess_wide.jpg) center/cover}
.r{background:linear-gradient(110deg,rgba(225,85,50,.74),rgba(200,55,105,.72),rgba(125,85,220,.74),rgba(50,150,210,.70)),url(assets/shrimp_wide.jpg) center/cover}
.bowl{border-radius:50%;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px rgba(255,255,255,.12)}
.bowl img{width:100%;height:100%;border-radius:50%;display:block}
.vs{border-radius:50%;background:#fff;color:#06202e;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-.05em;box-shadow:0 0 0 14px rgba(255,255,255,.22),0 24px 60px rgba(0,0,0,.55)}
.word{font-weight:900;letter-spacing:-.04em;line-height:.88;white-space:nowrap;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.green{color:#7cf29a}
.rainbow{background:linear-gradient(90deg,#ffe14d,#ff7a45,#ff4f8b,#a77bff,#5fd0ff);-webkit-background-clip:text;color:transparent}
.kick{font-weight:800;letter-spacing:.32em;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
.pill{border-radius:99px;background:#fff;color:#06202e;font-weight:800;letter-spacing:.12em;white-space:nowrap}
</style></head><body><div id="c"></div>
<script>
const q=new URLSearchParams(location.search);
const W=1080,H=+q.get('h')||1920;
const c=document.getElementById('c');c.style.width=W+'px';c.style.height=H+'px';
document.body.style.width=W+'px';document.body.style.height=H+'px';
const tall=H>1500;
// layout for Reel cover (keeps key content in the centre 3:4 area for the grid crop) and for 4:5 feed
const L=tall?{
  split:[1040,860], bowl:420, gB:[120,500], cB:[540,935], vs:175,
  kick:[300,30], gW:[320,180], cW:[1525,150], tag:[1595,30]
}:{
  split:[720,560], bowl:350, gB:[110,275], cB:[620,600], vs:150,
  kick:[80,26], gW:[110,165], cW:[1110,132], tag:[1260,26]
};
const [yl,yr]=L.split, ym=(yl+yr)/2;
const add=(cls,css,html='')=>{const d=document.createElement('div');d.className='abs '+cls;d.style.cssText+=css;d.innerHTML=html;c.append(d);return d};
add('half g',`clip-path:polygon(0 0,100% 0,100% ${yr}px,0 ${yl}px)`);
add('half r',`clip-path:polygon(0 ${yl}px,100% ${yr}px,100% 100%,0 100%)`);
// white seam along the diagonal
c.insertAdjacentHTML('beforeend',`<svg class="abs" style="left:0;top:0" width="${W}" height="${H}"><line x1="-10" y1="${yl}" x2="${W+10}" y2="${yr}" stroke="#fff" stroke-width="8" opacity=".9"/></svg>`);
add('bowl',`left:${L.gB[0]}px;top:${L.gB[1]}px;width:${L.bowl}px;height:${L.bowl}px`,'<img src="assets/goddess.png">');
add('bowl',`left:${L.cB[0]}px;top:${L.cB[1]}px;width:${L.bowl}px;height:${L.bowl}px`,'<img src="assets/shrimp.png">');
add('vs',`width:${L.vs}px;height:${L.vs}px;left:${W/2-L.vs/2}px;top:${ym-L.vs/2}px;font-size:${L.vs*.46}px`,'VS');
add('kick',`left:0;width:${W}px;text-align:center;top:${L.kick[0]-L.kick[1]*1.6}px;font-size:${L.kick[1]}px`,'THE BOWL BATTLE');
add('word green',`left:0;width:${W}px;text-align:center;top:${L.gW[0]}px;font-size:${L.gW[1]}px`,'GREEN');
add('word rainbow',`left:0;width:${W}px;text-align:center;top:${L.cW[0]-L.cW[1]}px;font-size:${L.cW[1]}px`,'COLORFUL');
add('pill',`left:50%;transform:translateX(-50%);top:${L.tag[0]-L.tag[1]*.6}px;font-size:${L.tag[1]}px;padding:${L.tag[1]*.6}px ${L.tag[1]*1.2}px`,'WHICH TEAM ARE YOU?');
</script></body></html>
